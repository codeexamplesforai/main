.input{width:100%;padding:.5rem .75rem;border-radius:.5rem;background:#0f1629;border:1px solid #1f2737;font-size:.875rem;color:#c7ccd6;outline:none;transition:border .15s}
.input:focus{border-color:#3b82f6;box-shadow:0 0 0 1px rgba(59,130,246,.3)}
.input::placeholder{color:#2d3748}
.card{background:#0f1629;border:1px solid #1f2737;border-radius:.75rem;padding:1.25rem}

.tab:hover{color:#c7ccd6}
.tab.active{color:white;border-bottom-color:#3b82f6}
.toggle{position:relative;display:inline-block;width:36px;height:20px;border-radius:9999px;background:#1f2737;cursor:pointer;transition:background .15s;vertical-align:middle;border:none}
.toggle.on{background:#10b981}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:white;border-radius:9999px;transition:transform .15s}
.toggle.on::after{transform:translateX(16px)}

function buildEntities(){
  const out = []; const types = ['account','client','transaction'];
  for(let i=0;i<30;i++){
    const t = types[i%3];
    const prefix = t==='account'?'ACC':(t==='client'?'CLIENT':'TXN');
    const num = String(100000+i*7891).padStart(8,'0');
    const atl = +(0.15+Math.sin(i*1.7)*0.35+0.4).toFixed(2);
    const btl = +(0.20+Math.cos(i*2.1)*0.30+0.30).toFixed(2);
    const aScore = Math.max(0.05,Math.min(0.97,atl));
    const bScore = Math.max(0.05,Math.min(0.95,btl));
    const hasAlert = aScore>=0.55;
    out.push({
      entity_key: `${prefix}_${num}`, entity_type: t,
      atl_score: aScore, btl_score: bScore,
      has_alert: hasAlert,
      alert_id: hasAlert? `ALT_20260519_${String(1000+i).padStart(6,'0')}` : null,
      computed_at:'2026-05-19T14:23:45Z',
      feature_vector:{
        entity_key:`${prefix}_${num}`, entity_type:t, computed_at:'2026-05-19T14:23:45Z',
        transaction_features:{ txn_count_24h:5+i*3, avg_amount_24h:2400+i*180, max_amount_24h:8200+i*420, cross_border_share:+(0.05+(i%9)*0.07).toFixed(2), velocity_score:+(0.2+(i%7)*0.1).toFixed(2) },
        account_features:{ account_age_days:180+i*30, dormant_burst_flag: i%5===0, counterparty_concentration:+(0.3+(i%6)*0.08).toFixed(2) },
        client_features:{ is_pep: i%9===0, adverse_media_score:+(0.05+(i%8)*0.06).toFixed(2), jurisdiction_risk:+(0.1+(i%6)*0.1).toFixed(2) },
        derived_features:{ composite_risk_score: aScore },
        lineage:{ blocks_executed:['fb_001','fb_002','fb_003','fb_005','fb_007','fb_010','fb_012'], total_features:23 }
      }
    });
  }
  return out;
}

function buildSignals(){
  // Realistic per-RT drivers and threshold templates
  const RT_TEMPLATES = {
    'RT#11':{drivers:{ben_country_count:5,hrj_share:0.42,distinct_hrj_destinations:3},thresholds:{ben_country_count:3,hrj_share:0.30}},
    'RT#16':{drivers:{nra_share:0.68,distinct_countries:7,unusual_corridor_count:4},thresholds:{nra_share:0.50,distinct_countries:5}},
    'RT#17':{drivers:{flagged_cp_count:4,critical_cp_count:1,flagged_volume_pct:0.61},thresholds:{flagged_cp_count:2,flagged_volume_pct:0.40}},
    'RT#18':{drivers:{is_pep:true,adverse_media_score:0.62,pep_associates:2},thresholds:{adverse_media_score:0.50}},
    'RT#21':{drivers:{velocity_z:3.4,txn_count_24h:23,peer_p95_count:8},thresholds:{velocity_z:3.0,txn_count_24h:12}},
    'RT#23':{drivers:{dormant_days_prior:142,burst_count:18,burst_volume_usd:187420},thresholds:{dormant_days_prior:90,burst_count:5}},
    'RT#24':{drivers:{round_share:0.58,distinct_rounded_amounts:6},thresholds:{round_share:0.50}},
    'RT#25':{drivers:{in_out_ratio:0.96,pass_through_volume:142800,window_hours:72},thresholds:{in_out_ratio:0.85,window_hours:72}},
    'RT#26':{drivers:{near_threshold_share:0.31,near_threshold_count:7,band_min:9000,band_max:9999},thresholds:{near_threshold_share:0.20}},
    'RT#46':{drivers:{name_mismatch_pct:0.42,distinct_beneficiary_names:5},thresholds:{name_mismatch_pct:0.25}},
    'RT#NET':{drivers:{fan_out_count:14,topology_anomaly:0.71,suspicious_path_hops:2},thresholds:{topology_anomaly:0.60}},
    'RT#ANOM':{drivers:{reconstruction_error:0.42,anomaly_percentile:0.97},thresholds:{anomaly_percentile:0.95}}
  };
  // Each ATL/HYBRID model gets a subset of entities; unsupervised models score everyone
  const out = []; let id=1000;
  MODELS.forEach((m,mi)=>{
    const isAnom = m.category==='UNSUPERVISED';
    const cls = isAnom?'BTL':'ATL';
    const tpl = RT_TEMPLATES[m.risk_typology] || RT_TEMPLATES['RT#11'];
    // pick ~12 entities per model (anomaly models touch more)
    const target = isAnom? 18 : 9;
    ENTITIES.forEach((e,i)=>{
      // deterministic spread so different models surface different entities
      if(((i*7 + mi*13) % ENTITIES.length) >= target) return;
      const baseScore = isAnom? e.btl_score : e.atl_score;
      const score = Math.max(0.10, Math.min(0.97, baseScore + ((mi%3)*0.03) - 0.04));
      const recurrence = isAnom? 1 : (1 + ((i+mi)%3));
      const nOcc = isAnom? 0 : (1 + ((i+mi*3)%3));
      const occurrences = [];
      for(let k=0;k<nOcc;k++){
        const occScore = +(Math.min(0.99,score + (k===0?0:0.02-k*0.04))).toFixed(3);
        const txCount = 2 + ((i*5 + mi*7 + k*3)%4);
        const txIds = Array.from({length:txCount},(_,j)=>`TXN-${String(800000 + (i*53 + mi*97 + k*11 + j*13)%500000).padStart(8,'0')}`);
        // Per-occurrence breached thresholds (subset of template thresholds)
        const breached = {}; let bi=0;
        for(const [k2,v2] of Object.entries(tpl.thresholds)){ if(bi<2){ breached[k2]=v2; bi++; } }
        // Per-occurrence drivers (transaction attributes)
        const drivers = {};
        if(m.risk_typology==='RT#11'){ drivers.beneficiary_country = ['AE','HK','PK','MY'][k%4]; drivers.amount_usd = 8200 + k*1340; drivers.payment_format = 'WIRE_OUT'; }
        else if(m.risk_typology==='RT#26'){ drivers.amount_usd = 9000 + (k*317)%999; drivers.timestamp_hour = 23 - k; drivers.payment_format = 'WIRE_OUT'; }
        else if(m.risk_typology==='RT#25'){ drivers.amount_usd = 18400 - k*2100; drivers.same_day_outflow = true; drivers.in_out_lag_min = 12 + k*4; }
        else if(m.risk_typology==='RT#17'){ drivers.counterparty_id = `ACC-${String(400000 + (i*53+k*131)%500000).padStart(8,'0')}`; drivers.counterparty_severity = ['CRITICAL','HIGH','MEDIUM'][k%3]; drivers.amount_usd = 12400 + k*2300; }
        else if(m.risk_typology==='RT#21'){ drivers.txn_count_24h = 12 + k*4; drivers.peer_cohort_p95 = 8; drivers.amount_usd = 4800 + k*1200; }
        else if(m.risk_typology==='RT#23'){ drivers.dormant_days = 142 - k*8; drivers.burst_amount_usd = 8200 + k*1340; drivers.burst_index = k+1; }
        else { drivers.amount_usd = 4200 + k*900; drivers.payment_format = 'WIRE_OUT'; }
        occurrences.push({
          occurrence_id:`OCC-${String(900000+id*7+k).padStart(8,'0')}`,
          occurrence_score: occScore,
          contributing_transaction_ids: txIds,
          breached_thresholds: breached,
          individual_decision_drivers: drivers
        });
      }
      out.push({
        signal_id:`SIG-${String(id++).padStart(7,'0')}`,
        model: m.id, model_id: m.model_id, model_name: m.name, model_category: m.category,
        entity_key: e.entity_key, entity_type: e.entity_type,
        score:+score.toFixed(3), classification: cls,
        generated_at: `2026-05-19T${String(8+(i+mi)%10).padStart(2,'0')}:${String((i*13+mi*7)%60).padStart(2,'0')}:50Z`,
        risk_typology: m.risk_typology,
        recurrence_count: recurrence,
        payload:{
          aggregated_decision_drivers: tpl.drivers,
          aggregated_occurrences: occurrences,
          recurrence_count: recurrence,
          detection_model: m.model_id,
          gtm_version: 'gtm_2026_05_v3'
        }
      });
    });
  });
  return out;
}

function buildProfiles(){
  const RT_REAL = ['RT#11','RT#16','RT#17','RT#18','RT#21','RT#23','RT#24','RT#25','RT#26','RT#46','RT#NET'];
  const DRIVER_BANK = {
    'RT#11':{ben_country_count:5,hrj_share:0.42,distinct_hrj_destinations:3,top_destination:'AE'},
    'RT#16':{nra_share:0.68,distinct_countries:7,unusual_corridor_count:4},
    'RT#17':{flagged_cp_count:4,critical_cp_count:1,flagged_volume_pct:0.61,top_severity:'HIGH'},
    'RT#18':{is_pep:true,adverse_media_score:0.62,pep_associates:2},
    'RT#21':{velocity_z:3.4,txn_count_24h:23,peer_p95_count:8},
    'RT#23':{dormant_days_prior:142,burst_count:18,burst_volume_usd:187420},
    'RT#24':{round_share:0.58,distinct_rounded_amounts:6},
    'RT#25':{in_out_ratio:0.96,pass_through_volume:142800,window_hours:72},
    'RT#26':{near_threshold_share:0.31,near_threshold_count:7,band:'$9,000-$9,999'},
    'RT#46':{name_mismatch_pct:0.42,distinct_beneficiary_names:5},
    'RT#NET':{fan_out_count:14,topology_anomaly:0.71,suspicious_path_hops:2}
  };
  return ENTITIES.map((e,i)=>{
    const rtCount = 3 + (i%4); // 3-6 RTs triggered per entity
    const tra = [];
    let atlCount = 0, btlCount = 0;
    for(let k=0;k<rtCount;k++){
      const rt = RT_REAL[(i*3 + k*5) % RT_REAL.length];
      const cls = (k===0)?'ATL' : ((i*7+k*11)%5===0 ? 'BTL' : 'ATL');
      const sc = Math.max(0.18, Math.min(0.97, e.atl_score - k*0.07 + ((i+k)%3)*0.02));
      const occCount = 1 + ((i+k)%4);
      if(cls==='ATL') atlCount++; else btlCount++;
      tra.push({
        risk_typology: rt,
        classification: cls,
        score: +sc.toFixed(3),
        occurrence_count: occCount,
        contributing_signals: [`SIG-${String(1000+i*7+k).padStart(7,'0')}`],
        breached_thresholds: {occurrence:0.65, btl:0.50}
      });
    }
    // Consolidated drivers — merge the per-RT drivers for the triggered RTs
    const consolidated = {};
    tra.forEach(r=>{
      const d = DRIVER_BANK[r.risk_typology] || {};
      Object.entries(d).forEach(([k,v])=>{ consolidated[`${r.risk_typology}.${k}`] = v; });
    });
    return {
      entity_key:e.entity_key, entity_type:e.entity_type,
      atl_aggregated_score:e.atl_score,
      anomaly_score:e.btl_score,
      atl_signal_count: atlCount,
      btl_signal_count: btlCount,
      total_typologies_triggered: tra.length,
      profile:{
        targeted_risk_array: tra,
        consolidated_decision_drivers: consolidated
      }
    };
  });
}

/* ---------- JSON TREE ---------- */
function renderJsonTree(obj, depth=0){
  if(obj===null) return `<span class="z">null</span>`;
  if(typeof obj==='string') return `<span class="s">"${esc(obj)}"</span>`;
  if(typeof obj==='number') return `<span class="n">${obj}</span>`;
  if(typeof obj==='boolean') return `<span class="b">${obj}</span>`;
  if(Array.isArray(obj)){
    if(obj.length===0) return `<span class="z">[]</span>`;
    const rows = obj.map((v,i)=>{
      const isComplex = (v && typeof v==='object');
      if(isComplex){
        return `<div><div class="row" onclick="this.parentElement.classList.toggle('collapsed');event.stopPropagation();"><span class="chev"></span><span class="k">${i}</span><span class="z">: ${Array.isArray(v)?'[ '+v.length+' ]':'{ '+Object.keys(v).length+' }'}</span></div><div class="indent">${renderJsonTree(v,depth+1).replace(/^<div class="json-tree">|<\/div>$/g,'')}</div></div>`;
      } else {
        return `<div class="leaf"><span class="chev"></span><span class="k">${i}</span>: ${renderJsonTree(v,depth+1)}</div>`;
      }
    }).join('');
    return depth===0? `<div class="json-tree">${rows}</div>` : rows;
  }
  if(typeof obj==='object'){
    const keys = Object.keys(obj);
    if(keys.length===0) return `<span class="z">{}</span>`;
    const rows = keys.map(k=>{
      const v = obj[k];
      const isComplex = (v && typeof v==='object');
      if(isComplex){
        return `<div><div class="row" onclick="this.parentElement.classList.toggle('collapsed');event.stopPropagation();"><span class="chev"></span><span class="k">${esc(k)}</span><span class="z">: ${Array.isArray(v)?'[ '+v.length+' ]':'{ '+Object.keys(v).length+' }'}</span></div><div class="indent">${renderJsonTree(v,depth+1).replace(/^<div class="json-tree">|<\/div>$/g,'')}</div></div>`;
      } else {
        return `<div class="leaf"><span class="chev"></span><span class="k">${esc(k)}</span>: ${renderJsonTree(v,depth+1)}</div>`;
      }
    }).join('');
    return depth===0? `<div class="json-tree">${rows}</div>` : rows;
  }
  return esc(String(obj));
}

function makeIbmDatasets(){

  const txRows = Array.from({length:12},(_,i)=>({txn_id:`TXN_${String(800000+i*13).padStart(8,'0')}`,account_id:`ACC_${String(100023+i*7).padStart(8,'0')}`,counterparty_id:`ACC_${String(500001+i*11).padStart(8,'0')}`,amount_usd:1200+i*873,currency:CURRENCIES[i%CURRENCIES.length],timestamp:`2026-05-19T${String(8+i%12).padStart(2,'0')}:${String((i*7)%60).padStart(2,'0')}:00Z`,origin_country:COUNTRIES[i%COUNTRIES.length],destination_country:COUNTRIES[(i+3)%COUNTRIES.length],is_cross_border:i%3!==0,is_laundering:i%11===0,payment_format:['ACH','WIRE','CHECK','RTP'][i%4]}));

  const cliSchema=[{name:'client_id',type:'string',null_pct:0},{name:'name',type:'string',null_pct:0},{name:'segment',type:'string',null_pct:0},{name:'kyc_tier',type:'string',null_pct:0},{name:'is_pep',type:'boolean',null_pct:0},{name:'adverse_media_score',type:'numeric',null_pct:0.5},{name:'home_country',type:'string',null_pct:0},{name:'onboarded_date',type:'date',null_pct:0}];
  const cliRows = Array.from({length:10},(_,i)=>({client_id:`CLIENT_${String(40010+i*3).padStart(5,'0')}`,name:['Acme Trading Ltd','Northwind Imports','Globex Holdings','Initech LLC','Hooli Cap','Vandelay Industries','Soylent Group','Cyberdyne','Tyrell Corp','Stark Industries'][i%10],segment:['RETAIL','SMB','CORPORATE','PRIVATE','INSTITUTIONAL'][i%5],kyc_tier:['T1','T2','T3'][i%3],is_pep:i%7===0,adverse_media_score:+(0.05+i*0.06).toFixed(2),home_country:COUNTRIES[i%COUNTRIES.length],onboarded_date:`202${i%6}-${String(1+i%12).padStart(2,'0')}-15`}));
  return [
    {name:'transactions',source:'IBM_AML',rows:10452,columns:txSchema.length,size_bytes:2415000,schema:txSchema,preview_rows:txRows,aml_metrics:{cross_border_pct:12.5,laundering_pct:0.08,currency_count:8,currencies:[{code:'USD',count:45200},{code:'EUR',count:12800},{code:'GBP',count:3400},{code:'JPY',count:2100},{code:'CHF',count:1500},{code:'AED',count:900},{code:'SGD',count:700},{code:'HKD',count:500}]}},
    {name:'accounts',source:'IBM_AML',rows:3821,columns:accSchema.length,size_bytes:540000,schema:accSchema,preview_rows:accRows},
    {name:'clients',source:'IBM_AML',rows:1500,columns:cliSchema.length,size_bytes:380000,schema:cliSchema,preview_rows:cliRows}
  ];
}

function renderValidationResult(panel){

      {status:'pass', name:'Python AST parsed', detail:'No syntax errors. Module compiles cleanly.'},

      {status:'pass', name:'Output range', detail:'Score columns within [0, 1] · counts non-negative.'}
    ]}
  ];
  const totals = {pass:0,warn:0,fail:0};
  stages.forEach(s=> s.checks.forEach(c=> totals[c.status]++));
  const stageStatus = (s)=> s.checks.some(c=>c.status==='fail')?'fail':(s.checks.some(c=>c.status==='warn')?'warn':'pass');
  const statusIcon = {pass:'check-circle',warn:'alert-triangle',fail:'x-circle'};
  const statusColor = {pass:'text-emerald-400',warn:'text-amber-400',fail:'text-red-400'};

    const st = stageStatus(s);
    return `<div data-stage-block="${s.stage}">
      <button type="button" class="flex items-center gap-3 w-full px-4 py-3 hover:bg-navy-700/40 transition-colors" onclick="toggleValStage('${s.stage}')">

function logLine(kind,msg){
  const now = new Date(); const ts = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  const c = document.getElementById('exec-console'); if(!c) return;
  const div = document.createElement('div');
  div.insertAdjacentHTML('beforeend', `<span class="ts">[${ts}]</span> <span class="${kind}">${esc(msg)}</span>`);
  c.appendChild(div); c.scrollTop = c.scrollHeight;
}
function setBlockCardStatus(id,kind,time){
  const card = document.querySelector(`[data-block-card="${id}"]`); if(!card) return;
  const dot = card.querySelector('[data-status-dot]');
  const te = card.querySelector('[data-exec-time]');
  dot.className = 'w-2 h-2 rounded-full ' + ({pending:'bg-navy-500',running:'bg-blue-400 animate-pulse',passed:'bg-emerald-400',failed:'bg-red-400'}[kind]||'bg-navy-500');
  if(time) te.textContent = time;
}
function startExecuteRun(){
  if(_execIv) return;
  state.pipelineRunning = true;
  document.getElementById('run-pipe-btn').disabled = true;
  document.getElementById('exec-progress').classList.remove('hidden');
  document.getElementById('exec-bar-wrap').classList.remove('hidden');
  document.getElementById('exec-summary').classList.add('hidden');
  setHTML(document.getElementById('exec-console'),'');
  state.blocks.forEach(b=>setBlockCardStatus(b.id,'pending','—'));
  renderTopbar();
  const dry = document.getElementById('dryrun').checked;
  const blocks = state.blocks.slice();
  const total = blocks.length;
  let i = 0, passed=0, failed=0;
  logLine('info', `Starting feature pipeline execution${dry?' (dry-run)':'…'}`);
  logLine('info', `Loaded ${fmtNum(3521)} transactions, 412 accounts, 308 clients`);
  _execIv = setInterval(()=>{
    if(i>=total){
      clearInterval(_execIv); _execIv=null;
      const featCount = totalFeatures();
      logLine('ok', `Pipeline complete: ${total} blocks attempted, ${passed} passed, ${failed} failed.`);
      state.pipelineRunning = false;
      document.getElementById('run-pipe-btn').disabled = false;
      const newHist = {id:'exec_'+Math.random().toString(36).slice(2,6),trigger:'MANUAL',started_at:new Date().toISOString(),status:failed===0?'COMPLETED':(passed>0?'COMPLETED':'FAILED'),duration_ms:45000+Math.floor(Math.random()*8000),blocks_attempted:total,blocks_passed:passed,blocks_failed:failed,entities_computed:12445,alerts_generated:234,log:`[run complete] ${passed}/${total} passed`};
      state.history = [newHist, ...state.history];
      setHTML(document.getElementById('exec-summary'),`<div class="grid grid-cols-1 md:grid-cols-3 gap-4">${metricCard({label:'Blocks Passed',value:fmtNum(passed),accent:'emerald'})}${metricCard({label:'Blocks Failed',value:fmtNum(failed),accent:'red'})}${metricCard({label:'Features Computed',value:fmtNum(featCount),accent:'blue'})}</div><div class="text-xs text-navy-400 mt-3 font-mono">Duration: ${fmtDuration(newHist.duration_ms)}</div>`);
      document.getElementById('exec-summary').classList.remove('hidden');
      lucide.createIcons();
      renderTopbar();
      return;
    }
    const b = blocks[i];
    const willFail = (b.status==='ERROR' || Math.random()<0.04);
    logLine('info', `[${b.name.replace(/ /g,'_').toLowerCase()}] Computing…`);
    setBlockCardStatus(b.id,'running');
    document.getElementById('exec-current').textContent = 'Current: '+b.name;
    setTimeout(()=>{
      const ms = 120 + Math.floor(Math.random()*700);
      if(willFail){ failed++; logLine('err', `[${b.name.replace(/ /g,'_').toLowerCase()}] FAILED: KeyError 'destination_country'`); setBlockCardStatus(b.id,'failed',ms+' ms'); }
      else { passed++; logLine('ok', `[${b.name.replace(/ /g,'_').toLowerCase()}] PASSED in ${ms} ms`); setBlockCardStatus(b.id,'passed',ms+' ms'); }
      document.getElementById('exec-counts').textContent = `${i+1} / ${total} blocks`;
      document.getElementById('exec-bar').style.width = (((i+1)/total)*100).toFixed(0)+'%';
      i++;
    }, 200);
  }, 460);
}
</script>

function filterEntityList(q){
  q = q.toLowerCase();

  document.getElementById('store-suggest').classList.remove('hidden');
}

PAGES.registry = function(){
  const q = state.registrySearch.toLowerCase();
  let rows = state.blocks.filter(b=> !q || b.name.toLowerCase().includes(q)||b.category.toLowerCase().includes(q)||b.risk_typology.toLowerCase().includes(q));
  const {col,dir} = state.registrySort;
  rows.sort((a,b)=>{
    let av=a[col]||0, bv=b[col]||0;
    if(col==='last_execution_ms'){ av=av||0; bv=bv||0; }
    if(typeof av==='string'){ av=av.toLowerCase(); bv=bv.toLowerCase(); }
    return (av>bv?1:av<bv?-1:0) * (dir==='asc'?1:-1);
  });
  const sortIcon = (c)=> col===c? (dir==='asc'?'arrow-up-narrow-wide':'arrow-down-narrow-wide') : 'chevrons-up-down';
  const th = (label,key)=>`<th class="px-3 py-2.5 text-left text-[10px] uppercase tracking-wider text-navy-300 font-semibold cursor-pointer hover:text-white" onclick="toggleRegistrySort('${key}')"><span class="inline-flex items-center gap-1">${label}<i data-lucide="${sortIcon(key)}" class="w-3 h-3 ${col===key?'text-blue-400':'text-navy-500'}"></i></span></th>`;
  const createdByPill = (c)=>{
    if(c==='AI_GENERATED') return `<span class="badge bg-purple-900/50 text-purple-300 border-purple-700/40"><i data-lucide="sparkles" class="w-3 h-3"></i>AI</span>`;
    if(c==='SYSTEM') return `<span class="badge bg-navy-700 text-navy-300 border-navy-600"><i data-lucide="cog" class="w-3 h-3"></i>System</span>`;
    return `<span class="badge bg-blue-900/40 text-blue-300 border-blue-700/40"><i data-lucide="user" class="w-3 h-3"></i>User</span>`;
  };
  return `<div class="animate-fade-in space-y-4">
    <h1 class="sr-only">Feature Registry</h1>
    <div class="flex flex-wrap items-center gap-3">
      <div class="relative flex-1 max-w-md"><i data-lucide="search" class="w-4 h-4 text-navy-500 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        <input class="input pl-9" placeholder="Search name, category, typology…" value="${esc(state.registrySearch)}" oninput="state.registrySearch=this.value;navigate('registry')" />
      </div>
      <div class="text-xs text-navy-400 font-mono">${rows.length} of ${state.blocks.length}</div>
    </div>
    <div class="card p-0 overflow-hidden">
      <div class="overflow-auto max-h-[680px] scrollbar-thin">
        <table class="w-full text-sm">
          <thead class="bg-navy-800 sticky top-0"><tr>
            ${th('Name','name')}
            ${th('Category','category')}
            ${th('Axis','axis')}
            ${th('Risk Typology','risk_typology')}
            ${th('Status','status')}
            <th class="px-3 py-2.5 text-right text-[10px] uppercase tracking-wider text-navy-300 font-semibold">Output</th>
            <th class="px-3 py-2.5 text-left text-[10px] uppercase tracking-wider text-navy-300 font-semibold">Created By</th>
            ${th('Exec','last_execution_ms')}
            ${th('Ver','version')}
            <th></th>
          </tr></thead>
          <tbody>${rows.map((b,i)=>`<tr class="border-t border-navy-600/40 ${i%2?'bg-navy-700/30':''} hover:bg-navy-700/60 cursor-pointer" onclick="openBlockDetail('${b.id}')">
            <td class="px-3 py-2.5 text-navy-100 font-medium">${esc(b.name)}</td>
            <td class="px-3 py-2.5">${categoryBadge(b.category)}</td>
            <td class="px-3 py-2.5 font-mono text-xs text-navy-200">${b.axis}</td>
            <td class="px-3 py-2.5 font-mono text-xs text-navy-200">${b.risk_typology}</td>
            <td class="px-3 py-2.5">${statusBadge(b.status)}</td>
            <td class="px-3 py-2.5 font-mono text-xs text-navy-200 text-right">${b.output_features.length} features</td>
            <td class="px-3 py-2.5">${createdByPill(b.created_by)}</td>
            <td class="px-3 py-2.5 font-mono text-xs text-navy-300 text-right">${b.last_execution_ms? b.last_execution_ms+' ms':'—'}</td>
            <td class="px-3 py-2.5 font-mono text-xs text-navy-300 text-right">v${b.version}</td>
            <td class="px-3 py-2.5 text-right"><button class="btn-ghost p-1" onclick="event.stopPropagation();toast('Block definition exported','success')"><i data-lucide="download" class="w-3.5 h-3.5"></i></button></td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>
  </div>`;
};
function toggleRegistrySort(col){
  if(state.registrySort.col===col){ state.registrySort.dir = state.registrySort.dir==='asc'?'desc':'asc'; }
  else { state.registrySort = {col,dir:'asc'}; }

}

/* ==============================================================

PAGES.typologies = function(){
  const filt = state.typologyFilter;
  const cats = ['ALL','GEOGRAPHIC','CLIENT_RISK','BEHAVIORAL','TRANSACTION','NETWORK','CASH','CURRENCY','PRODUCT','TERRORISM'];
  const catColor = {GEOGRAPHIC:'sky',CLIENT_RISK:'violet',BEHAVIORAL:'amber',TRANSACTION:'blue',NETWORK:'emerald',CASH:'orange',CURRENCY:'teal',PRODUCT:'rose',TERRORISM:'red'};
  const pill = (c)=>{
    const color = catColor[c]||'navy';
    const active = filt===c;
    if(c==='ALL') return `<button class="px-3 py-1.5 rounded-lg text-xs font-semibold ${active?'bg-navy-100 text-navy-900':'bg-navy-700 hover:bg-navy-600 text-navy-200'}" onclick="state.typologyFilter='ALL';navigate('typologies')">All</button>`;
    return `<button class="px-3 py-1.5 rounded-lg text-xs font-semibold ${active?`bg-${color}-500/40 text-${color}-200`:`bg-${color}-900/30 hover:bg-${color}-800/40 text-${color}-300`}" onclick="state.typologyFilter='${c}';navigate('typologies')">${c.replace('_',' ')}</button>`;
  };
  const list = RISK_TYPOLOGIES.filter(t=>filt==='ALL'||t.category===filt);
  const tcard = (t)=>{
    const color = catColor[t.category]||'navy';
    return `<button class="card text-left card-hover w-full" onclick="openTypologyDrawer('${t.code}')">
      <div class="flex items-start gap-3 mb-2">
        <div class="w-9 h-9 rounded-lg bg-${color}-500/10 border border-${color}-500/30 flex items-center justify-center shrink-0"><i data-lucide="shield" class="w-4 h-4 text-${color}-300"></i></div>
        <div class="flex-1 min-w-0">
          <h3 class="text-sm font-semibold text-navy-50 leading-tight">${esc(t.name)}</h3>
          <div class="mt-1.5">${badge(t.category.replace('_',' '),`bg-${color}-900/40 text-${color}-300 border-${color}-700/40`)}</div>
        </div>
      </div>
      <p class="text-xs text-navy-300 line-clamp-3 mb-3">${esc(t.description)}</p>
      <div class="flex flex-wrap gap-1.5">${t.indicators.slice(0,3).map(ind=>`<span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-navy-700 text-navy-300 border border-navy-600">${ind}</span>`).join('')}</div>
    </button>`;
  };
  return `<div class="animate-fade-in space-y-5">
    <h1 class="sr-only">Risk Typologies</h1>
    <div class="flex flex-wrap items-center gap-2 sticky top-0 z-10 bg-navy-900 pb-2">${cats.map(pill).join('')}</div>
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">${list.map(tcard).join('')}</div>
  </div>`;
};
function openTypologyDrawer(code){
  const t = RISK_TYPOLOGIES.find(x=>x.code===code); if(!t) return;
  const catColor = {GEOGRAPHIC:'sky',CLIENT_RISK:'violet',BEHAVIORAL:'amber',TRANSACTION:'blue',NETWORK:'emerald',CASH:'orange',CURRENCY:'teal',PRODUCT:'rose',TERRORISM:'red'}[t.category]||'navy';
  const relatedBlocks = state.blocks.filter(b=>b.risk_typology===t.code);
  openDrawer(`<div>
    <div class="flex items-center justify-between px-5 py-4 border-b border-navy-600 sticky top-0 bg-navy-800 z-10">
      <div class="flex items-center gap-2 min-w-0"><i data-lucide="shield" class="w-4 h-4 text-${catColor}-300"></i><h3 class="text-base font-semibold text-white truncate">${esc(t.name)}</h3></div>
      <button onclick="closeDrawer()" class="text-navy-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="p-5 space-y-5">
      <div>${badge(t.category.replace('_',' '),`bg-${catColor}-900/40 text-${catColor}-300 border-${catColor}-700/40`)} ${badge('FATF: '+t.fatf,'bg-navy-700 text-navy-300 border-navy-600')}</div>
      <div><div class="text-[10px] uppercase tracking-wider text-navy-500 font-semibold mb-2">Definition</div><p class="text-sm text-navy-200 leading-relaxed">${esc(t.description)}</p></div>
      <div><div class="text-[10px] uppercase tracking-wider text-navy-500 font-semibold mb-2">Detection Methods</div><ul class="space-y-1.5 text-sm text-navy-200">${t.methods.map(m=>`<li class="flex gap-2"><i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400 mt-0.5 shrink-0"></i><span>${esc(m)}</span></li>`).join('')}</ul></div>
      <div><div class="text-[10px] uppercase tracking-wider text-navy-500 font-semibold mb-2">Indicators</div><div class="flex flex-wrap gap-1.5">${t.indicators.map(i=>`<span class="text-[11px] font-mono px-2 py-1 rounded bg-navy-700 text-navy-200 border border-navy-600">${i}</span>`).join('')}</div></div>
      <div><div class="text-[10px] uppercase tracking-wider text-navy-500 font-semibold mb-2">Default Thresholds</div><div class="grid grid-cols-3 gap-2">${metricCard({label:'Occurrence',value:fmtScore(t.th.occurrence),accent:'blue'})}${metricCard({label:'BTL',value:fmtScore(t.th.btl),accent:'amber'})}${metricCard({label:'Weight',value:t.th.weight.toFixed(1),accent:'emerald'})}</div></div>
      <div><div class="text-[10px] uppercase tracking-wider text-navy-500 font-semibold mb-2">Related Blocks</div>${relatedBlocks.length? `<div class="space-y-1.5">${relatedBlocks.map(b=>`<button class="w-full flex items-center justify-between p-2.5 rounded-lg bg-navy-700/60 hover:bg-navy-700 border border-navy-600 text-left" onclick="state.factoryFilter='${b.category}';closeDrawer();navigate('factory')"><div><div class="text-sm text-navy-100">${esc(b.name)}</div><div class="text-[11px] text-navy-400 font-mono">${b.risk_typology}</div></div><i data-lucide="arrow-right" class="w-4 h-4 text-navy-400"></i></button>`).join('')}</div>` : `<p class="text-xs text-navy-500">No blocks currently mapped to this typology.</p>`}</div>
    </div>
  </div>`);
}

PAGES.framework = function(){
  const layers = [
    {n:1,name:'Feature Factory',icon:'blocks',color:'blue',metric:totalFeatures()+' features'},
    {n:2,name:'Model Layer',icon:'brain',color:'violet',metric:MODELS.length+' models'},

    {n:5,name:'Alerts',icon:'alert-triangle',color:'emerald',metric:fmtNum(state.alerts.length)+' alerts'}
  ];
  const layerCard = (l,idx)=>`<div class="min-w-[180px] bg-${l.color}-500/10 border border-${l.color}-500/30 rounded-xl p-4">
    <div class="flex items-center justify-between mb-2">${layerBadge(l.n)}<i data-lucide="${l.icon}" class="w-4 h-4 text-${l.color}-300"></i></div>
    <div class="text-sm font-semibold text-white">${esc(l.name)}</div>
    <div class="text-lg font-bold text-${l.color}-300 font-mono mt-1">${esc(l.metric)}</div>
  </div>`;
  const arrow = `<i data-lucide="chevron-right" class="w-5 h-5 text-navy-500 self-center shrink-0"></i>`;
  const archStrip = layers.map((l,i)=>i? arrow+layerCard(l,i) : layerCard(l,i)).join('');
  const hi = state.alerts.filter(a=>a.priority==='HIGH').sort((a,b)=>b.atl_score-a.atl_score).slice(0,5);
  const histBins = [2345,1820,1402,990,612,418,278,167,93,42];
  const maxBin = Math.max(...histBins);

    ${histBins.map((v,i)=>{
      const h = v/maxBin*H; const x = 15+i*BW; const y = H-h;
      const c = i<4? '#10b981' : (i<7? '#f59e0b' : '#ef4444');
      return `<g><rect x="${x+4}" y="${y}" width="${BW-8}" height="${h}" fill="${c}" opacity="0.85"><title>${(i*0.1).toFixed(1)} - ${((i+1)*0.1).toFixed(1)}: ${fmtNum(v)} entities</title></rect><text x="${x+BW/2}" y="${H+18}" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#6f7a8e">${(i*0.1).toFixed(1)}</text></g>`;
    }).join('')}
  </svg>`;
  return `<div class="animate-fade-in space-y-6">

      <div><h2 class="text-xl font-semibold text-white">5-Layer AML Detection Pipeline</h2><p class="text-xs text-navy-400 mt-0.5">End-to-end view; click any layer to drill in.</p></div>

    </div>
    <div class="overflow-x-auto scrollbar-thin pb-2"><div class="flex items-stretch gap-2 min-w-max">${archStrip}</div></div>
    <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-3">
      ${metricCard({label:'L1 · Features',value:fmtNum(totalFeatures()*57),sublabel:'computed last run',accent:'blue'})}
      ${metricCard({label:'L1 · Blocks Active',value:state.blocks.filter(b=>b.status==='ACTIVE').length,sublabel:'of '+state.blocks.length,accent:'blue'})}
      ${metricCard({label:'L1 · Last Exec',value:timeAgo(state.history[0]?.started_at),sublabel:state.history[0]?.status||'—',accent:'blue'})}
      ${metricCard({label:'L2 · Models',value:MODELS.length,sublabel:'rule + hybrid + unsup.',accent:'violet'})}
      ${metricCard({label:'L2 · Signals',value:fmtNum(SIGNALS.length*8),sublabel:'this batch',accent:'violet'})}
      ${metricCard({label:'L3 · Profiled',value:fmtNum(state.profiles.length*270),sublabel:'entities',accent:'amber'})}
      ${metricCard({label:'L3 · Avg ATL',value:'0.34',sublabel:'mean score',accent:'amber'})}
      ${metricCard({label:'L4 · Rules',value:state.rules.length,sublabel:'active',accent:'rose'})}
      ${metricCard({label:'L4 · Track A',value:'145',sublabel:'auto-escalated',accent:'rose'})}
      ${metricCard({label:'L5 · Alerts',value:state.alerts.length,sublabel:state.alerts.filter(a=>a.priority==='HIGH').length+' HIGH',accent:'emerald'})}
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="card lg:col-span-2">
        <div class="flex items-center justify-between mb-3 pb-3 border-b border-navy-600/60"><div class="flex items-center gap-2"><i data-lucide="bar-chart-3" class="w-4 h-4 text-blue-400"></i><h3 class="text-base font-semibold text-white">Entity Score Distribution</h3></div><span class="text-xs text-navy-400">10 bins · 0.0 to 1.0</span></div>

        <div class="flex items-center justify-between mb-3 pb-3 border-b border-navy-600/60"><div class="flex items-center gap-2"><i data-lucide="alert-triangle" class="w-4 h-4 text-red-400"></i><h3 class="text-base font-semibold text-white">High-Priority Alerts</h3></div></div>
        <div class="space-y-2">${hi.map(a=>`<button class="w-full flex items-center justify-between p-2 rounded-lg hover:bg-navy-700/60 text-left" onclick="state.preselectedAlertId='${a.alert_id}';navigate('alerts')">

        </button>`).join('')}</div>
      </div>
    </div>
  </div>`;
};

function setStageStatus(key,status,counter){
  const tile = document.querySelector(`[data-stage="${key}"]`); if(!tile) return;

  const cnt = tile.querySelector('[data-stage-counter]');
  if(status==='idle') icon.outerHTML = `<div data-stage-icon class="w-4 h-4 rounded-full border-2 border-navy-500"></div>`;
  if(status==='running') icon.outerHTML = `<i data-lucide="loader-2" data-stage-icon class="w-4 h-4 text-blue-400 animate-spin-slow"></i>`;
  if(status==='done') icon.outerHTML = `<i data-lucide="check-circle-2" data-stage-icon class="w-4 h-4 text-emerald-400"></i>`;
  if(status==='error') icon.outerHTML = `<i data-lucide="x-circle" data-stage-icon class="w-4 h-4 text-red-400"></i>`;

function pipeLog(stage, msg, kind='info'){
  const now = new Date(); const ts=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  const c = document.getElementById('pipe-console'); if(!c) return;
  const div = document.createElement('div');
  div.insertAdjacentHTML('beforeend',`<span class="ts">[${ts}]</span> <span class="stage">[${stage}]</span> <span class="${kind}">${esc(msg)}</span>`);

}

  renderTopbar();
  const script = [
    {s:'L1',m:'Loading feature vectors…',k:'info',stage:'L1',action:()=>setStageStatus('L1','running','—')},
    {s:'L1',m:'Loaded 12,445 entities',k:'ok',stage:'L1',action:()=>setStageStatus('L1','running','12,445 entities')},

    {s:'L2',m:'Inference batch 2/3',k:'info'},

    {s:'L3',m:'Aggregating signals…',k:'info',stage:'L3',action:()=>setStageStatus('L3','running','—')},

    {s:'L4',m:'Applying escalation rules',k:'info',stage:'L4',action:()=>setStageStatus('L4','running','—')},
    {s:'L4',m:'Track A=145 · Track B=8,089 · LLM=0',k:'ok',stage:'L4',action:()=>setStageStatus('L4','done','145 / 8089 / 0')},
    {s:'L5',m:'Packaging alerts',k:'info',stage:'L5',action:()=>setStageStatus('L5','running','—')},
    {s:'L5',m:'Packaged 234 alerts',k:'ok',stage:'L5',action:()=>setStageStatus('L5','done','234 alerts')},
    {s:'done',m:'Pipeline complete in 33 s',k:'ok'}
  ];
  let i=0;

function fmtVal(v){
  if(v===null || v===undefined) return '—';
  if(typeof v==='number') return Number.isInteger(v)? String(v) : v.toFixed(3);
  if(typeof v==='boolean') return v?'true':'false';
  if(Array.isArray(v)){ if(v.length===0) return '[]'; if(v.length<=4) return '['+v.map(fmtVal).join(', ')+']'; return '['+v.slice(0,3).map(fmtVal).join(', ')+', +'+(v.length-3)+']'; }
  if(typeof v==='string') return v;
  try { return JSON.stringify(v); } catch(e){ return String(v); }
}

/* ==============================================================
   SHARED — CounterpartyGraph
   Mirrors the real backend topology (backend/routers/investigate.py):
   - Focal entity at the centre, connected to every counterparty (up to 40)
   - Peer entities (other clients) connect ONLY to the counterparties they
     share with the focal — NOT to the focal directly. That's what creates
     the dense crossing-line network (real example: CLI-80087).
   ============================================================== */
function buildGraphDataForEntity(entityKey){
  const h = [...entityKey].reduce((a,c)=>a+c.charCodeAt(0),0);
  const seed = (n,m)=> ((h*9301 + n*49297) % 233280) / 233280 * (m||1);
  const cpCount = 28 + (h%10);       // 28-37 counterparties on outer ring
  const peerCount = 7 + (h%4);       // 7-10 peer entities on inner ring
  const flagPool = [
    {code:'ofac_sdn', severity:'CRITICAL', name:'OFAC SDN list match', description:'Direct OFAC SDN list match (sanctions screen 2026-05-19)', source:'OFAC SDN'},
    {code:'un_cons', severity:'CRITICAL', name:'UN Consolidated list', description:'Entity appears on UN Consolidated Sanctions list', source:'UN Security Council'},
    {code:'fatf_grey', severity:'HIGH', name:'FATF high-risk jurisdiction', description:'Counterparty domiciled in FATF grey-list jurisdiction (AE/PK)', source:'FATF Feb 2026'},
    {code:'sar_prec', severity:'HIGH', name:'Prior SAR history', description:'Counterparty has 2 prior SARs filed by peer institutions', source:'SAR universe'},
    {code:'msb_unreg', severity:'HIGH', name:'Unregistered MSB', description:'Operating as money service business without FinCEN registration', source:'FinCEN registry'},
    {code:'vasp', severity:'HIGH', name:'Unlicensed VASP', description:'Virtual asset service provider with weak KYC controls', source:'Chainalysis'},
    {code:'adverse_media', severity:'MEDIUM', name:'Adverse media', description:'Adverse media coverage; NLP risk score 0.62', source:'Refinitiv WC'},
    {code:'shell', severity:'MEDIUM', name:'Shell-company indicator', description:'Mailbox-only address, single director, no website', source:'KYC scan'},
    {code:'pep_assoc', severity:'MEDIUM', name:'PEP associate', description:'Linked beneficial owner is PEP associate', source:'World-Check'},
    {code:'hr_sector', severity:'MEDIUM', name:'High-risk sector', description:'Operates in cash-intensive / precious-metals sector', source:'Sector taxonomy'}
  ];
  const cpNameBank = ['Northwind Exports','Globex Holdings','Acme Trading','Vandelay Inds','Soylent Group','Initech Cap','Hooli Trust','Tyrell Corp','Cyberdyne','Stark Inds','Rekall Mining','Wonka Industries','Massive Dyn','Oscorp','Pied Piper','Dunder Mifflin','Sterling Coop','Pearson Hard','Wayne Ent','LexCorp','Umbrella Co','Stark Energy','Aperture Sci','Black Mesa','Weyland-Yutani','Krusty Krab','Bluth Co','Pawnee Tx','Sterling Inv'];
  const cps = []; let flaggedCount=0;
  for(let i=0;i<cpCount;i++){
    // ~45% of counterparties are flagged
    const flagged = seed(i*13,1) < 0.45;
    const flag = flagged ? flagPool[Math.floor(seed(i*17,flagPool.length))] : null;
    if(flagged) flaggedCount++;
    const num = String(400000 + Math.floor(seed(i*23,500000))).padStart(8,'0');
    const name = cpNameBank[i%cpNameBank.length] + (i<cpNameBank.length?'':' '+Math.floor(seed(i*29,99)));
    cps.push({
      id: `cp_${i}`,
      label: name,
      cp_id: `ACC-${num}`,
      type: 'COUNTERPARTY',
      country: COUNTRIES[Math.floor(seed(i*31,COUNTRIES.length))],
      entity_type: 'COUNTERPARTY',
      flagged, severity: flag?flag.severity:null, flags: flag?[flag]:[],
      count: 2 + Math.floor(seed(i*37,18)),
      volume: 1200 * (3 + Math.floor(seed(i*41,30)))
    });
  }
  const peerNameBank = ['CLI-40213','CLI-40789','CLI-41205','CLI-41832','CLI-42198','CLI-42775','CLI-43421','CLI-44098','CLI-44832','CLI-45501'];
  const peers = [];
  for(let i=0;i<peerCount;i++){
    peers.push({id:`peer_${i}`, label:peerNameBank[i%peerNameBank.length], type:'PEER', entity_type:'CLIENT', country: COUNTRIES[Math.floor(seed(i*43+7,COUNTRIES.length))], flagged:false, severity:null, flags:[], count:0, volume:0});
  }
  // Build edges:
  //   1. focal → counterparty for every cp
  //   2. peer → counterparty for the cps each peer shares with focal (each peer
  //      shares 4-9 random cps). NO direct focal-peer edges.
  const edges = [];
  cps.forEach(cp=> edges.push({source:'focal', target:cp.id, count:cp.count, volume:cp.volume, flagged:cp.flagged}));
  peers.forEach((p,pi)=>{
    const sharedCount = 4 + Math.floor(seed(pi*47,6));
    const picked = new Set();
    let attempts = 0;
    while(picked.size < sharedCount && attempts < sharedCount*6){
      const idx = Math.floor(seed(pi*53 + attempts*7, cpCount));
      picked.add(idx);
      attempts++;
    }
    picked.forEach(idx=>{
      const cp = cps[idx];
      const cnt = 1 + Math.floor(seed(pi*59 + idx*11, 5));
      p.count += cnt;
      edges.push({source:p.id, target:cp.id, count:cnt, volume:0, flagged: cp.flagged && seed(pi*61+idx,1)<0.5});
    });
  });
  return {
    entity_key: entityKey,
    focal: {id:'focal', label:entityKey, type:'FOCAL', country:'US'},
    counterparties: cps,
    peers: peers,
    edges,
    stats: {counterparties:cps.length, flagged_counterparties:flaggedCount, peer_entities:peers.length, node_count: 1+cps.length+peers.length, edge_count: edges.length}
  };
}
function renderCounterpartyGraph(entityKey){
  const g = buildGraphDataForEntity(entityKey);
  const hops = state.graphHops;
  const W=820, H=560, cx=W/2, cy=H/2;
  // Outer counterparty ring — alternate two radii so labels don't collide
  const ringCPouter = Math.min(W,H)*0.42;
  const ringCPinner = Math.min(W,H)*0.34;
  const cpNodes = g.counterparties.map((n,i)=>{
    const a = (2*Math.PI*i/g.counterparties.length) - Math.PI/2;
    const r = i%2===0? ringCPouter : ringCPinner;
    return {...n, x: cx+Math.cos(a)*r, y: cy+Math.sin(a)*r};
  });
  // Peer ring offset by half-step so peers don't overlap counterparties radially
  const ringPeer = Math.min(W,H)*0.18;
  const peerNodes = (hops>=2) ? g.peers.map((n,i)=>{
    const a = (2*Math.PI*(i+0.5)/g.peers.length) - Math.PI/2;
    return {...n, x: cx+Math.cos(a)*ringPeer, y: cy+Math.sin(a)*ringPeer};
  }) : [];
  const focalNode = {...g.focal, x:cx, y:cy};
  const nodesById = {focal:focalNode};
  cpNodes.forEach(n=> nodesById[n.id]=n);
  peerNodes.forEach(n=> nodesById[n.id]=n);
  const activeEdges = g.edges.filter(e=> nodesById[e.source] && nodesById[e.target]);
  const colorForNode = (n)=>{
    if(n.type==='FOCAL') return '#3b82f6';
    if(n.type==='PEER') return '#8b5cf6';
    if(!n.flagged) return '#64748b';
    if(n.severity==='CRITICAL') return '#dc2626';
    if(n.severity==='HIGH') return '#ef4444';
    return '#f59e0b';
  };
  const radiusForNode = (n)=> n.type==='FOCAL'?14 : (n.type==='PEER'?7 : 8);
  const edgeSVG = activeEdges.map(e=>{
    const a = nodesById[e.source], b = nodesById[e.target];
    const isPeerEdge = nodesById[e.source].type==='PEER' || nodesById[e.target].type==='PEER';
    const stroke = e.flagged ? '#ef4444' : (isPeerEdge ? '#7c3aed' : '#334155');
    const opacity = e.flagged ? 0.65 : (isPeerEdge ? 0.35 : 0.45);
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${stroke}" stroke-opacity="${opacity}" stroke-width="${Math.max(0.5,Math.min(e.count/3,3.5))}"/>`;
  }).join('');
  const cpLabel = (n)=>{
    const lab1 = (n.label||'').length>18 ? n.label.slice(0,16)+'…' : (n.label||'');
    const lab2 = n.cp_id || '';
    return `<text x="${n.x}" y="${n.y+radiusForNode(n)+10}" text-anchor="middle" font-family="DM Sans" font-size="9.5" fill="#cbd5e1" pointer-events="none">${esc(lab1)}</text>${lab2?`<text x="${n.x}" y="${n.y+radiusForNode(n)+21}" text-anchor="middle" font-family="JetBrains Mono" font-size="8" fill="#64748b" pointer-events="none">${esc(lab2)}</text>`:''}`;
  };
  const peerLabel = (n)=> `<text x="${n.x}" y="${n.y+radiusForNode(n)+11}" text-anchor="middle" font-family="JetBrains Mono" font-size="9.5" fill="#c4b5fd" pointer-events="none">${esc(n.label)}</text>`;
  const nodeSVG = (n)=>{
    const r = radiusForNode(n);
    const color = colorForNode(n);
    const pulse = n.flagged? `<circle cx="${n.x}" cy="${n.y}" r="${r+3}" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2"><animate attributeName="r" values="${r+3};${r+5};${r+3}" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.6s" repeatCount="indefinite"/></circle>`:'';
    const flagJson = encodeURIComponent(JSON.stringify({label:n.label,cp_id:n.cp_id,type:n.type,flagged:n.flagged,severity:n.severity,country:n.country,count:n.count,volume:n.volume,flags:n.flags,entity_type:n.entity_type}));
    const lbl = n.type==='PEER' ? peerLabel(n) : cpLabel(n);
    return `<g class="cp-node" onmouseenter="showGraphHover('${flagJson}')" onmouseleave="hideGraphHover()" style="cursor:pointer">${pulse}<circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${color}" stroke="#0f172a" stroke-width="1.5"/>${lbl}</g>`;
  };
  const focalLabel = g.focal.label.length>22? g.focal.label.slice(0,20)+'…' : g.focal.label;
  const focalSVG = `<g><circle cx="${cx}" cy="${cy}" r="18" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="14" fill="#3b82f6"/><text x="${cx}" y="${cy+30}" text-anchor="middle" font-family="JetBrains Mono" font-size="11" font-weight="600" fill="#dbeafe" pointer-events="none">${esc(focalLabel)}</text></g>`;
  const legendDot = (color,label,pulse)=>`<span class="inline-flex items-center gap-1.5"><span class="inline-block w-2 h-2 rounded-full ${pulse?'animate-pulse':''}" style="background:${color}"></span><span class="text-[11px] text-navy-400">${esc(label)}</span></span>`;
  return `<div class="bg-navy-800 border border-navy-600 rounded-xl overflow-hidden">
    <div class="flex items-center justify-between px-5 py-3 border-b border-navy-600">
      <div class="flex items-center gap-2"><i data-lucide="network" class="w-3.5 h-3.5 text-navy-400"></i><h3 class="text-sm font-semibold text-white">Counterparty Network</h3></div>
      <div class="flex items-center gap-3">
        <div class="text-[10px] text-navy-400 font-mono">${g.stats.counterparties} CPs · ${g.stats.flagged_counterparties} flagged · ${g.stats.peer_entities} peers · ${g.stats.edge_count} edges</div>
        <div class="flex gap-1">
          <button class="px-2 py-0.5 rounded text-xs ${hops===1?'bg-blue-500 text-white':'bg-navy-700 text-navy-300 hover:bg-navy-600'}" onclick="state.graphHops=1;navigate(state.page)">1-hop</button>
          <button class="px-2 py-0.5 rounded text-xs ${hops===2?'bg-blue-500 text-white':'bg-navy-700 text-navy-300 hover:bg-navy-600'}" onclick="state.graphHops=2;navigate(state.page)">2-hop</button>
        </div>
      </div>
    </div>
    <div class="relative bg-navy-900">
      <svg viewBox="0 0 ${W} ${H}" class="block w-full" style="max-height:600px">
        ${edgeSVG}
        ${focalSVG}
        ${cpNodes.map(nodeSVG).join('')}
        ${peerNodes.map(nodeSVG).join('')}
      </svg>
      <div id="cp-hover" class="absolute top-3 left-3 hidden pointer-events-none bg-navy-800/95 border border-navy-600 rounded-lg p-3 text-xs max-w-[340px] shadow-xl"></div>
    </div>
    <div class="flex flex-wrap items-center gap-3 px-5 py-2 bg-navy-900/40 border-t border-navy-700 text-[11px] text-navy-400">
      ${legendDot('#3b82f6','Focal entity')}
      ${legendDot('#64748b','Counterparty')}
      ${legendDot('#dc2626','Critical (OFAC / UN)',true)}
      ${legendDot('#ef4444','High (FATF / SAR / MSB / VASP)',true)}
      ${legendDot('#f59e0b','Medium (adverse media / PEP / shell)')}
      ${legendDot('#8b5cf6','Peer entity (shares counterparties)')}

function showGraphHover(encoded){

    if(d.count) html += `<p class="text-[10px] text-navy-400">tx_count=${d.count}${d.volume?` · volume=$${fmtNum(d.volume)}`:''}</p>`;
    if(d.flags && d.flags.length>0){

      d.flags.forEach(f=>{
        html += `<div><p class="text-[11px] font-semibold ${sevColor}">● ${esc(f.name||f.flag||f.code)} <span class="text-[9px] font-normal text-navy-500">[${esc(f.severity||f.sev||'')}]</span></p><p class="text-[10px] text-navy-300 leading-snug mt-0.5">${esc(f.description||f.desc||'')}</p><p class="text-[9px] text-navy-500 italic mt-0.5">Source: ${esc(f.source||'')}</p></div>`;

function renderInvestigationChat(entityKey){
  const turns = state.investigationChats[entityKey] || [];
  const e = state.entities.find(x=>x.entity_key===entityKey) || {entity_key:entityKey,atl_score:0.5,btl_score:0.4};
  const askedSet = new Set(turns.filter(t=>t.role==='user').map(t=>t.content));
  const remaining = STARTER_QUESTIONS.filter(q=>!askedSet.has(q));
  const startersBlock = (label) => remaining.length===0
    ? `<div class="text-[11px] text-navy-500 italic pl-1">All starter questions have been asked. Type your own follow-up below.</div>`
    : `<div>${label?`<div class="text-[10px] uppercase tracking-wider text-navy-500 mb-1.5 pl-1">${esc(label)}</div>`:''}<div class="flex flex-wrap gap-2">${remaining.map(q=>`<button onclick="askInvestigation('${entityKey}','${esc(q).replace(/'/g,'&#39;')}')" class="px-2.5 py-1.5 rounded-full bg-navy-700 hover:bg-navy-600 text-navy-200 text-[11px] text-left">${esc(q)}</button>`).join('')}</div></div>`;
  const bubble = (t)=>{
    if(t.role==='user'){
      return `<div class="flex gap-2 justify-end"><div class="max-w-[80%] rounded-xl px-3 py-2 text-sm leading-relaxed whitespace-pre-wrap bg-blue-500 text-white">${esc(t.content)}</div><div class="w-6 h-6 rounded-full bg-blue-500/30 flex items-center justify-center shrink-0"><i data-lucide="user" class="w-3 h-3 text-blue-300"></i></div></div>`;
    }
    return `<div class="flex gap-2 justify-start"><div class="w-6 h-6 rounded-full bg-violet-500/30 flex items-center justify-center shrink-0"><i data-lucide="bot" class="w-3 h-3 text-violet-300"></i></div><div class="max-w-[80%] rounded-xl px-3 py-2 text-sm leading-relaxed whitespace-pre-wrap bg-navy-700 text-navy-100">${esc(t.content)}</div></div>`;
  };
  const pending = state._chatPending && state._chatPending===entityKey;
  const typing = pending ? `<div class="flex items-center gap-2 text-xs text-navy-400 pl-1"><i data-lucide="bot" class="w-3 h-3"></i><span class="inline-flex gap-1"><span class="w-1.5 h-1.5 rounded-full bg-navy-400 animate-pulse"></span><span class="w-1.5 h-1.5 rounded-full bg-navy-400 animate-pulse" style="animation-delay:150ms"></span><span class="w-1.5 h-1.5 rounded-full bg-navy-400 animate-pulse" style="animation-delay:300ms"></span></span><span>thinking…</span></div>`:'';
  // After the last AI reply (no pending request), surface the remaining starter chips as "Suggested follow-ups"
  const lastTurn = turns[turns.length-1];
  const showFollowUps = !pending && lastTurn && lastTurn.role==='assistant';
  return `<div class="bg-navy-800 border border-navy-600 rounded-xl overflow-hidden flex flex-col" style="min-height:380px">
    <div class="flex items-center justify-between px-5 py-3 border-b border-navy-600">
      <div class="flex items-center gap-2"><i data-lucide="message-circle" class="w-3.5 h-3.5 text-navy-400"></i><h3 class="text-sm font-semibold text-white">Investigation Chat</h3><span class="text-[10px] text-navy-500 font-mono">entity=${esc(entityKey)}</span></div>
      <span class="text-[10px] px-2 py-0.5 rounded bg-emerald-900/40 text-emerald-300">Claude grounded</span>
    </div>
    <div id="chat-scroll-${esc(entityKey)}" class="flex-1 overflow-auto scrollbar-thin px-5 py-4 space-y-3" style="max-height:380px">
      ${turns.length===0
        ? `<div class="space-y-3"><p class="text-xs text-navy-400">Ask Claude anything about <span class="font-mono text-white">${esc(entityKey)}</span>. The model sees the full L1-L5 context (features, signals, profile, decision, alert, recent transactions, prior dispositions).</p>${startersBlock('')}</div>`
        : turns.map(bubble).join('') + typing + (showFollowUps ? `<div class="pt-2 border-t border-navy-700/60 mt-2">${startersBlock('Suggested follow-ups')}</div>` : '')}
    </div>
    <div class="border-t border-navy-700 px-3 py-2 flex items-center gap-2 bg-navy-900/40">
      <input id="chat-input-${esc(entityKey)}" class="flex-1 bg-navy-900 border border-navy-600 rounded-lg px-3 py-2 text-sm text-white placeholder-navy-500 focus:outline-none focus:border-blue-500" placeholder="Ask about this entity…" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();askInvestigation('${esc(entityKey)}',this.value);this.value='';}"/>
      <button class="inline-flex items-center gap-1 px-3 py-2 rounded-lg bg-blue-500 hover:bg-blue-600 text-white text-sm" onclick="askInvestigation('${esc(entityKey)}',document.getElementById('chat-input-${esc(entityKey)}').value);document.getElementById('chat-input-${esc(entityKey)}').value='';"><i data-lucide="send" class="w-3.5 h-3.5"></i>Ask</button>
    </div>
  </div>`;
}
function askInvestigation(entityKey,q){
  if(!q || !q.trim()) return;
  const list = state.investigationChats[entityKey] || (state.investigationChats[entityKey]=[]);
  list.push({role:'user', content:q.trim()});
  state._chatPending = entityKey;
  refreshChatPanel(entityKey);
  setTimeout(()=>{
    const e = state.entities.find(x=>x.entity_key===entityKey) || {entity_key:entityKey,atl_score:0.5};
    const fn = CANNED_ANSWERS[q.trim()];
    const ans = fn? fn(e) : defaultAnswer(q,e);
    list.push({role:'assistant', content:ans});
    state._chatPending = null;
    refreshChatPanel(entityKey);
  }, 850);
}
function refreshChatPanel(entityKey){
  // re-render whichever page is showing; both drilldown and the case modal use it
  if(state.page==='drilldown'){ navigate('drilldown'); }
  else if(state.caseModalOpen){ openCaseInvestigation(state.caseModalOpen); }
  else if(state.page==='cases'){ navigate('cases'); }
  setTimeout(()=>{ const el = document.getElementById(`chat-scroll-${entityKey}`); if(el) el.scrollTop = el.scrollHeight; }, 50);
}

          <div><label class="text-[10px] uppercase tracking-wider text-navy-400 block mb-1">Hours spent</label><input id="case-hours" type="number" step="0.5" class="w-full bg-navy-900 border border-navy-600 rounded-lg px-3 py-2 text-sm text-navy-100 font-mono" value="${c.hours_spent||''}" oninput="(state._caseDispositionDraft['${id}']=state._caseDispositionDraft['${id}']||{}).hours=Number(this.value)"/></div>

}
function submitCaseDisp(id,disp){
  const c = state.cases.find(x=>x.alert_id===id); if(!c) return;
  const draft = state._caseDispositionDraft[id]||{};
  c.disposition = disp; c.investigation_notes = draft.notes||c.investigation_notes; c.hours_spent = draft.hours||c.hours_spent;
  state.cases = state.cases.filter(x=>x.alert_id!==id);
  delete state._caseDispositionDraft[id];
  state.caseModalOpen = null;
  closeModal();
  toast(`Case closed: ${disp}`,'success');
  navigate('cases');
}

   ============================================================== */
PAGES.feedback = function(){
  const tp = 0.82, fp = 0.18, avg = 3.2, closed7d = 78;
  const fi = FEATURE_IMPORTANCE;
  const maxImp = Math.max(...fi.map(f=>f.importance));
  const bar = (f)=>`<div class="flex items-center gap-2 text-xs"><div class="font-mono text-navy-200 w-44 text-right truncate">${esc(f.name)}</div><div class="flex-1 h-3.5 bg-navy-700 rounded"><div class="h-full bg-gradient-to-r from-blue-600 to-violet-500 rounded" style="width:${(f.importance/maxImp*100).toFixed(0)}%"></div></div><div class="font-mono text-navy-300 w-12 text-right">${fmtScore(f.importance)}</div></div>`;
  const btlIdx = state.feedbackBtlIdx;
  const samples = state.entities.filter(e=>e.btl_score>0.5).slice(0,8);
  const sample = samples[btlIdx % samples.length];
  // Donuts
  const donut = (data,colors,title)=>{
    const total = data.reduce((a,b)=>a+b.v,0);
    let acc=0;
    const cx=70,cy=70,r=50,sw=14;
    const segs = data.map((d,i)=>{
      const a0 = acc/total*Math.PI*2 - Math.PI/2;
      acc += d.v;
      const a1 = acc/total*Math.PI*2 - Math.PI/2;
      const x0=cx+Math.cos(a0)*r, y0=cy+Math.sin(a0)*r;
      const x1=cx+Math.cos(a1)*r, y1=cy+Math.sin(a1)*r;
      const big = (a1-a0)>Math.PI? 1 : 0;
      return `<path d="M ${x0} ${y0} A ${r} ${r} 0 ${big} 1 ${x1} ${y1}" stroke="${colors[i]}" stroke-width="${sw}" fill="none" stroke-linecap="butt"/>`;
    }).join('');
    const legend = data.map((d,i)=>`<div class="flex items-center gap-2 text-xs"><span class="w-2.5 h-2.5 rounded-sm" style="background:${colors[i]}"></span><span class="text-navy-200">${esc(d.k)}</span><span class="ml-auto font-mono text-navy-400">${d.v}</span></div>`).join('');
    return `<div class="card"><div class="text-[10px] uppercase tracking-wider text-navy-500 mb-3">${esc(title)}</div><div class="flex items-center gap-4"><svg viewBox="0 0 140 140" class="w-32 h-32">${segs}<text x="70" y="74" text-anchor="middle" font-family="DM Sans" font-size="14" font-weight="700" fill="#e6e8ed">${total}</text></svg><div class="flex-1 space-y-1">${legend}</div></div></div>`;
  };
  const statusData = [{k:'OPEN',v:state.alerts.filter(a=>a.status==='OPEN').length},{k:'ASSIGNED',v:state.alerts.filter(a=>a.status==='ASSIGNED').length},{k:'CLOSED',v:state.alerts.filter(a=>a.status==='CLOSED').length}];
  const dispData = [{k:'TRUE_POSITIVE',v:14},{k:'FALSE_POSITIVE',v:7},{k:'ESCALATED',v:2},{k:'ROUTINE',v:5}];
  const recCard = (r)=>{
    const applied = r.status==='APPLIED';
    const dismissed = r.status==='DISMISSED';
    return `<div class="card">
      <div class="flex items-start justify-between mb-2 gap-2"><h3 class="text-sm font-semibold text-navy-50">${esc(r.title)}</h3>${statusBadge(r.status)}</div>
      <p class="text-xs text-navy-300 mb-3 line-clamp-3">${esc(r.reason)}</p>
      <div class="flex items-center gap-3 text-xs mb-3 pt-3 border-t border-navy-600/40"><span class="text-emerald-300 font-mono">TP ${r.tp_change>=0?'+':''}${r.tp_change}%</span><span class="text-red-300 font-mono">FP ${r.fp_change>=0?'+':''}${r.fp_change}%</span><span class="ml-auto flex items-center gap-1"><span class="text-[10px] text-navy-500">conf</span>${scorePill(r.confidence)}</span></div>
      <div class="flex gap-2">${applied? `<span class="btn-sec opacity-70 pointer-events-none"><i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>Applied</span>`:`<button class="btn-pri flex-1" onclick="applyRec('${r.id}')" ${dismissed?'disabled':''}><i data-lucide="check" class="w-4 h-4"></i>Apply</button><button class="btn-ghost" onclick="dismissRec('${r.id}')">Dismiss</button>`}</div>
    </div>`;
  };
  return `<div class="animate-fade-in space-y-6">
    <h1 class="sr-only">Feedback Loop</h1>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      ${metricCard({label:'TP Rate',value:fmtScore(tp),sublabel:'last 30d',accent:'emerald'})}
      ${metricCard({label:'FP Rate',value:fmtScore(fp),sublabel:'last 30d',accent:'red'})}
      ${metricCard({label:'Avg Handling',value:avg+' h',sublabel:'per case',accent:'amber'})}
      ${metricCard({label:'Cases Closed (7d)',value:closed7d,accent:'blue'})}
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="card">
        <div class="flex items-center justify-between mb-3 pb-3 border-b border-navy-600/60"><div class="flex items-center gap-2"><i data-lucide="bar-chart-2" class="w-4 h-4 text-blue-400"></i><h3 class="text-base font-semibold text-white">Top Contributing Features</h3></div></div>
        <div class="space-y-2">${fi.map(bar).join('')}</div>
      </div>
      <div class="card">
        <div class="flex items-center justify-between mb-3 pb-3 border-b border-navy-600/60"><div class="flex items-center gap-2"><i data-lucide="layers" class="w-4 h-4 text-amber-400"></i><h3 class="text-base font-semibold text-white">BTL Sample Review</h3></div><span class="text-xs text-navy-400 font-mono">${(btlIdx%samples.length)+1} / ${samples.length}</span></div>
        <div class="text-sm text-navy-200 mb-3">Sample: <span class="font-mono text-navy-50">${sample.entity_key}</span></div>
        <div class="grid grid-cols-2 gap-2 mb-3">
          <div><div class="text-[10px] uppercase text-navy-500">Current</div><div class="mt-1">${classificationPill('BTL')}</div></div>
          <div><div class="text-[10px] uppercase text-navy-500">Predicted Score</div><div class="mt-1">${scorePill(sample.btl_score)}</div></div>
        </div>
        <div class="flex gap-2"><button class="btn-pri flex-1" onclick="reviewBtl(true)"><i data-lucide="check" class="w-4 h-4"></i>Mark Correct</button><button class="btn-danger flex-1" onclick="reviewBtl(false)"><i data-lucide="x" class="w-4 h-4"></i>Mark Incorrect</button></div>
      </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      ${donut(statusData,['#3b82f6','#8b5cf6','#4a5568'],'Alerts by Status')}
      ${donut(dispData,['#10b981','#ef4444','#f59e0b','#6f7a8e'],'Cases by Disposition')}
    </div>
    <div class="card">
      <div class="flex items-center justify-between mb-3 pb-3 border-b border-navy-600/60"><div class="flex items-center gap-2"><i data-lucide="sparkles" class="w-4 h-4 text-violet-400"></i><h3 class="text-base font-semibold text-white">AI Model Recommendations</h3></div><button class="btn-sec" onclick="regenRecs(this)"><i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>Regenerate</button></div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">${state.recommendations.map(recCard).join('')}</div>
    </div>
  </div>`;
};
function reviewBtl(correct){ state.feedbackBtlIdx = (state.feedbackBtlIdx+1); toast(correct?'Marked correct':'Marked incorrect','success'); navigate('feedback'); }
function applyRec(id){ const r=state.recommendations.find(x=>x.id===id); if(r){ r.status='APPLIED'; toast('Recommendation applied','success'); navigate('feedback'); } }
function dismissRec(id){ const r=state.recommendations.find(x=>x.id===id); if(r){ r.status='DISMISSED'; toast('Dismissed','info'); navigate('feedback'); } }
function regenRecs(btn){
  const icon = btn.querySelector('i'); icon.classList.add('animate-spin-slow');
  setTimeout(()=>{ icon.classList.remove('animate-spin-slow'); state.recommendations = state.recommendations.map(r=>({...r,confidence:Math.min(0.99,Math.max(0.6,r.confidence + (Math.random()-0.5)*0.1))})); toast('Recommendations refreshed','success'); navigate('feedback'); }, 1500);
}

function promoteSandbox(){
  openModal(`<div class="bg-navy-800 border border-navy-600 rounded-2xl w-full max-w-md overflow-hidden flex flex-col animate-slide-up">
    <div class="px-6 py-4 border-b border-navy-600"><h2 class="text-lg font-semibold text-white">Promote to Production?</h2></div>
    <div class="p-6 text-sm text-navy-200">This will update production GTM and rule thresholds. Confirm?</div>
    <div class="px-6 py-4 border-t border-navy-600 flex justify-end gap-2"><button class="btn-sec" onclick="closeModal()">Cancel</button><button class="btn-pri" onclick="confirmPromote()">Promote</button></div>
  </div>`);
}
function confirmPromote(){ state.sandboxHistory = [{id:'sb_'+Math.random().toString(36).slice(2,6),started_at:new Date().toISOString(),status:'COMPLETED',gtm_count:state.sandboxOverridesGtm.length,rule_count:state.sandboxOverridesRules.length,alerts_delta:12,fp_delta:-1.8,notes:state.sandboxNotes||'Promoted sandbox config'}, ...state.sandboxHistory]; closeModal(); toast('Promoted to production','success'); navigate('sandbox'); }

/* ==============================================================
   PAGE 18 — ENTITY DRILLDOWN (matches real app layout)
   ============================================================== */
PAGES.drilldown = function(){
  let key = state.drilldownEntity || state.preselectedEntityKey || state.entities[0].entity_key;
  state.drilldownEntity = key; state.preselectedEntityKey = null;
  const e = state.entities.find(x=>x.entity_key===key) || state.entities[0];
  const prof = state.profiles.find(p=>p.entity_key===e.entity_key);
  const sigs = state.signals.filter(s=>s.entity_key===e.entity_key);
  const alert = state.alerts.find(a=>a.entity_key===e.entity_key);
  const matchedRule = state.rules.find(r=>{
    if(!r.active) return false;
    if(r.id==='r1') return e.atl_score>=0.75;
    if(r.id==='r2') return e.btl_score>=0.80;
    if(r.id==='r3') return e.atl_score>=0.45 && e.atl_score<0.65;
    if(r.id==='r4') return e.atl_score<0.65;
    return false;
  }) || state.rules[3];
  const adjustedScore = +(Math.min(0.99, e.atl_score * matchedRule.threshold + 0.05)).toFixed(2);

  /* synthetic L1 transactions for this entity */
  const txns = Array.from({length:24},(_,i)=>({
    txn_id:`TXN_${String(800000+i*13).padStart(8,'0')}`,
    timestamp:`2026-05-19T${String(8+i%14).padStart(2,'0')}:${String((i*7)%60).padStart(2,'0')}:00Z`,
    counterparty_id:`ACC_${String(400023+i*7).padStart(8,'0')}`,
    amount_usd: (i%5===0? 9800 : 1200+i*873),
    currency: CURRENCIES[i%CURRENCIES.length],
    origin_country: 'US',
    destination_country: COUNTRIES[(i+3)%COUNTRIES.length],
    is_cross_border: i%3!==0
  }));
  const txPage = state.drilldownPage||0;
  const pageSize = 8;
  const pageCount = Math.max(1, Math.ceil(txns.length/pageSize));
  const tslice = txns.slice(txPage*pageSize, (txPage+1)*pageSize);
  const txCols = ['txn_id','timestamp','counterparty_id','amount_usd','currency','destination_country','is_cross_border'];
  const txTable = `<div class="overflow-auto scrollbar-thin border border-navy-700/60 rounded-lg">
    <table class="w-full text-xs">
      <thead class="bg-navy-700/50"><tr>${txCols.map(c=>`<th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider text-navy-400 font-semibold whitespace-nowrap">${c}</th>`).join('')}</tr></thead>
      <tbody>${tslice.map((t,i)=>`<tr class="border-t border-navy-700/50 ${i%2?'bg-navy-700/20':''}">${txCols.map(c=>{
        const v = t[c];
        const cell = (c==='amount_usd') ? `$${fmtNum(v)}` : String(v);
        return `<td class="px-3 py-1.5 font-mono text-navy-200 whitespace-nowrap">${esc(cell)}</td>`;
      }).join('')}</tr>`).join('')}</tbody>
    </table>
    <div class="flex items-center justify-between px-3 py-2 border-t border-navy-700/60 bg-navy-900/40">
      <span class="text-[11px] text-navy-400">Page ${txPage+1} of ${pageCount} · ${txns.length} txns</span>
      <div class="flex gap-1"><button class="px-2 py-0.5 rounded text-xs bg-navy-700 hover:bg-navy-600 text-navy-200 disabled:opacity-40" ${txPage===0?'disabled':''} onclick="state.drilldownPage=Math.max(0,state.drilldownPage-1);navigate('drilldown')">Prev</button><button class="px-2 py-0.5 rounded text-xs bg-navy-700 hover:bg-navy-600 text-navy-200 disabled:opacity-40" ${txPage>=pageCount-1?'disabled':''} onclick="state.drilldownPage=Math.min(${pageCount-1},state.drilldownPage+1);navigate('drilldown')">Next</button></div>
    </div>
  </div>`;

  const l1Content = `<div class="space-y-4">
    <div><p class="text-[10px] uppercase tracking-wider text-navy-400 mb-2">Features</p><div class="overflow-auto max-h-72 scrollbar-thin">${renderJsonTree(e.feature_vector)}</div></div>
    <div><p class="text-[10px] uppercase tracking-wider text-navy-400 mb-2">Transactions</p>${txTable}</div>
  </div>`;

  const l2Content = sigs.length? `<div class="space-y-2">${sigs.map(s=>`<details class="bg-navy-900 border border-navy-700 rounded-lg group">
    <summary class="cursor-pointer flex items-center justify-between px-3 py-2 text-xs list-none">
      <span class="flex items-center gap-3"><i data-lucide="chevron-right" class="w-3 h-3 text-navy-400 group-open:rotate-90 transition-transform"></i><span class="font-mono text-white">${s.signal_id.slice(0,12)}</span><span class="font-mono text-navy-300">${s.risk_typology}</span>${classificationPill(s.classification)}</span>
      ${scorePill(s.score)}
    </summary>
    <div class="p-3 border-t border-navy-700">${renderJsonTree(s.payload)}</div>
  </details>`).join('')}</div>` : `<p class="text-sm text-navy-400">No signals generated for this entity.</p>`;

  const tra = prof?.profile?.targeted_risk_array || [];
  const l3Content = `<div class="space-y-4">
    <div class="overflow-auto scrollbar-thin border border-navy-700/60 rounded-lg">
      <table class="w-full text-xs">
        <thead class="bg-navy-700/50"><tr>
          <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider text-navy-400 font-semibold">Risk Typology</th>
          <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider text-navy-400 font-semibold">Classification</th>
          <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider text-navy-400 font-semibold">Score</th>
          <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider text-navy-400 font-semibold">Contributing Signals</th>
        </tr></thead>
        <tbody>${tra.map(r=>`<tr class="border-t border-navy-700/50"><td class="px-3 py-1.5 font-mono text-navy-200">${r.risk_typology}</td><td class="px-3 py-1.5">${classificationPill(r.classification)}</td><td class="px-3 py-1.5 text-right">${scorePill(r.score)}</td><td class="px-3 py-1.5 text-right font-mono text-navy-300">${r.contributing_signals.length}</td></tr>`).join('')}</tbody>
      </table>
    </div>
    <div><p class="text-[10px] uppercase tracking-wider text-navy-400 mb-2">Decision drivers (consolidated)</p><div class="overflow-auto max-h-60 scrollbar-thin">${renderJsonTree(prof?.profile||{})}</div></div>
  </div>`;

  const kv = (k,v,mono)=>`<div class="bg-navy-900/50 border border-navy-700 rounded-lg p-3"><p class="text-[10px] uppercase tracking-wider text-navy-400 mb-1">${esc(k)}</p><p class="text-sm ${mono?'font-mono':''} text-white">${esc(String(v))}</p></div>`;
  const llmReasoning = e.atl_score>=0.55 && e.atl_score<0.75 ? `Considered RT_VELOCITY (z=3.4σ) and RT_GEOGRAPHIC (42% cross-border to AE/HK). Adjusted score 0.${Math.floor(adjustedScore*100)} sits inside the LLM-triage band; recommending TRACK_B_LLM rather than auto-alert.` : null;
  const l4Content = `<div class="grid grid-cols-2 md:grid-cols-3 gap-3">
    ${kv('Disposition','pending')}
    ${kv('Track', matchedRule.track)}
    ${kv('Trigger Rule', matchedRule.name)}
    ${kv('Priority', e.atl_score>=0.80?'HIGH':(e.atl_score>=0.55?'MEDIUM':'LOW'))}
    ${kv('Classifier Score', fmtScore(e.atl_score), true)}
    ${kv('Adjusted Score', fmtScore(adjustedScore), true)}
  </div>${llmReasoning?`<div class="mt-3 bg-amber-900/10 border border-amber-500/30 rounded-lg p-3"><p class="text-[10px] uppercase tracking-wider text-amber-300 mb-1">LLM Reasoning</p><p class="text-sm text-amber-100/80 whitespace-pre-wrap">${esc(llmReasoning)}</p></div>`:''}`;

  const l5Content = alert? `<div class="space-y-3">
    <div class="flex items-center justify-between gap-3 flex-wrap">
      <div class="min-w-0 flex items-center gap-3 flex-wrap"><span class="font-mono text-sm text-navy-50">${alert.alert_id}</span>${priorityBadge(alert.priority)}${statusBadge(alert.status)}<span class="text-xs text-navy-400 font-mono">${fmtDateShort(alert.created_at)}</span></div>
      <button class="btn-pri" onclick="state.preselectedAlertId='${alert.alert_id}';navigate('alerts')">View full alert <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
    </div>
    <div class="bg-navy-900/50 border border-navy-700 rounded-lg p-3"><p class="text-[10px] uppercase tracking-wider text-navy-400 mb-1">Narrative</p><p class="text-sm text-navy-200 leading-relaxed">${esc(alert.entity_key)} crossed the ATL escalation threshold on ${alert.risk_typologies.join(' + ')}; ${alert.occurrences.length} occurrences contributed, including transactions to high-risk jurisdictions and structuring-band amounts.</p></div>
    <div><p class="text-[10px] uppercase tracking-wider text-navy-400 mb-2">Alert payload</p><div class="overflow-auto max-h-72 scrollbar-thin">${renderJsonTree(alert)}</div></div>
  </div>` : `<p class="text-sm text-navy-400">No alert generated for this entity.</p>`;

  return `<div class="animate-fade-in space-y-5">
    <div>
      <h1 class="text-2xl font-semibold text-white">Entity Drilldown</h1>
      <p class="text-sm text-navy-400 mt-1">Full journey L1 → L5 for a single entity.</p>
    </div>
    <div class="bg-navy-800 border border-navy-600 rounded-xl p-5">
      <div class="relative">
        <i data-lucide="search" class="w-3.5 h-3.5 text-navy-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        <input id="dd-search" class="w-full bg-navy-900 border border-navy-600 rounded-lg pl-9 pr-3 py-2 text-sm text-white font-mono placeholder-navy-500 focus:outline-none focus:border-blue-500" placeholder="Search by entity_key…" value="${esc(e.entity_key)}" oninput="ddSearch(this.value)" onfocus="document.getElementById('dd-suggest').classList.remove('hidden')" onblur="setTimeout(()=>document.getElementById('dd-suggest').classList.add('hidden'),200)" />
        <div id="dd-suggest" class="hidden absolute z-20 mt-1 w-full bg-navy-800 border border-navy-600 rounded-lg max-h-72 overflow-auto scrollbar-thin shadow-xl">${state.entities.slice(0,10).map(en=>`<button class="w-full text-left px-3 py-2 hover:bg-navy-700 text-xs font-mono text-navy-100" onmousedown="state.drilldownEntity='${en.entity_key}';state.drilldownPage=0;navigate('drilldown')">${en.entity_key} <span class="text-navy-500">· ${en.entity_type}</span></button>`).join('')}</div>
      </div>
    </div>
    <div class="bg-navy-800 border border-navy-600 rounded-xl p-5 flex items-center justify-between">
      <div>
        <p class="text-xs uppercase tracking-wider text-navy-400 mb-1">Entity</p>
        <p class="text-xl font-mono text-white">${esc(e.entity_key)}</p>
        <p class="text-xs text-navy-400 mt-1">${esc(e.entity_type)}</p>
      </div>
      <div class="text-right">
        <p class="text-xs uppercase tracking-wider text-navy-400 mb-1">Composite Risk</p>
        <div class="flex items-center gap-2 justify-end">${scorePill(e.atl_score)}<span class="text-2xl font-mono text-white">${fmtScore(e.atl_score)}</span></div>
      </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
      ${renderCounterpartyGraph(e.entity_key)}
      ${renderInvestigationChat(e.entity_key)}
    </div>
    ${layerSection('l1',1,'Layer 1 · Features + Transactions','',l1Content)}
    ${layerSection('l2',2,`Layer 2 · Signals`,`(${sigs.length})`,l2Content)}
    ${layerSection('l3',3,'Layer 3 · Risk Profile','',l3Content)}
    ${layerSection('l4',4,'Layer 4 · Decision','',l4Content)}
    ${layerSection('l5',5,'Layer 5 · Alert','',l5Content)}
  </div>`;
};
function ddSearch(q){
  q = q.toLowerCase();
  const matches = state.entities.filter(e=>e.entity_key.toLowerCase().includes(q)).slice(0,10);
  setHTML(document.getElementById('dd-suggest'), matches.length? matches.map(e=>`<button class="w-full text-left px-3 py-2 hover:bg-navy-700 text-xs font-mono text-navy-100" onmousedown="state.drilldownEntity='${e.entity_key}';navigate('drilldown')">${e.entity_key} <span class="text-navy-500">· ${e.entity_type}</span></button>`).join('') : `<div class="px-3 py-2 text-xs text-navy-500">No matches</div>`);
  document.getElementById('dd-suggest').classList.remove('hidden');
}
</script>

<script>
/* ==============================================================
   BOOT
   ============================================================== */
window.addEventListener('DOMContentLoaded', ()=>{
  renderSidebar();
  navigate('dashboard');
});
</script>
</body>
